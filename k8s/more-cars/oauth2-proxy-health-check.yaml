apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: oauth2-proxy
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /ping
        port: 4180
  targetRef:
    group: ""
    kind: Service
    name: oauth2-proxy
